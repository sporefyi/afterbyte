components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        Access token issued by POST /auth/verify after a wallet signature
        challenge. Identity endpoints require any authenticated wallet;
        admin endpoints additionally require an admin permission — every
        admin route performs the check and returns 403 FORBIDDEN otherwise.
  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque cursor from a previous `meta.nextCursor`. Encodes the
        sort/filter context; passing a cursor from a different query is a 422.
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema: { type: string }
      description: Public-read caching. Server returns 304 when the ETag matches.
    IfMatch:
      name: If-Match
      in: header
      schema: { type: string }
      description: Optimistic concurrency for editorial updates. Stale value
        yields 409 VERSION_CONFLICT.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
      description: |-
        REQUIRED on payment creation and other costly mutations. Scoped to
        user+route; the server persists the request hash and the response.
        Replaying the same key with the SAME body returns the original
        response; reuse with a DIFFERENT body is rejected (422
        VALIDATION_FAILED). Keys expire after 24h.
    LastEventId:
      name: Last-Event-ID
      in: header
      schema: { type: string }
      description: SSE reconnect cursor. Server replays retained events after
        this ID; if older than the 7-day retention, emits `resync_required`.
  headers:
    ETag:
      description: Entity tag for the response body.
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer, minimum: 0 }
  responses:
    ValidationFailed:
      description: Request failed validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: VALIDATION_FAILED
              message: 'limit must be between 1 and 100'
              requestId: 11111111-1111-4111-8111-111111111111
              retryable: false
              fieldErrors:
                - { field: limit, code: too_large, message: 'maximum is 100' }
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: UNAUTHORIZED
              message: 'authentication required'
              requestId: 11111111-1111-4111-8111-111111111111
              retryable: false
              fieldErrors: []
    Forbidden:
      description: Authenticated but not permitted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: FORBIDDEN
              message: 'admin permission required'
              requestId: 11111111-1111-4111-8111-111111111111
              retryable: false
              fieldErrors: []
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: NOT_FOUND
              message: 'dossier not found'
              requestId: 11111111-1111-4111-8111-111111111111
              retryable: false
              fieldErrors: []
    VersionConflict:
      description: Optimistic-concurrency conflict.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: VERSION_CONFLICT
              message: 'draft revision changed since you loaded it'
              requestId: 11111111-1111-4111-8111-111111111111
              retryable: false
              fieldErrors: []
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: RATE_LIMITED
              message: 'too many requests, retry shortly'
              requestId: 11111111-1111-4111-8111-111111111111
              retryable: true
              fieldErrors: []
    FeatureUnavailable:
      description: Feature flag is off (e.g. payments before activation).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: FEATURE_UNAVAILABLE
              message: 'payments are not enabled'
              requestId: 11111111-1111-4111-8111-111111111111
              retryable: false
              fieldErrors: []
    ProviderUnavailable:
      description: Upstream provider unavailable; nothing was invented.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: PROVIDER_UNAVAILABLE
              message: 'search provider unavailable'
              requestId: 11111111-1111-4111-8111-111111111111
              retryable: true
              fieldErrors: []
    PaymentNotFinalized:
      description: On-chain payment not yet finalized.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: PAYMENT_NOT_FINALIZED
              message: 'transaction not finalized on chain yet'
              requestId: 11111111-1111-4111-8111-111111111111
              retryable: true
              fieldErrors: []
    PaymentMismatch:
      description: Submitted transaction does not match the payment intent.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: PAYMENT_MISMATCH
              message: 'transaction recipient does not match the intent'
              requestId: 11111111-1111-4111-8111-111111111111
              retryable: false
              fieldErrors: []
    ProofPending:
      description: Receipt not yet finalized on chain; the publication stands.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: PROOF_PENDING
              message: 'receipt anchoring in progress'
              requestId: 11111111-1111-4111-8111-111111111111
              retryable: true
              fieldErrors: []
  schemas:
    # ------------------------------------------------------------------
    # Primitives
    Uuid:
      type: string
      format: uuid
      example: 11111111-1111-4111-8111-111111111111
    IsoDateTime:
      type: string
      format: date-time
      example: '2026-10-16T08:00:00Z'
    Sha256Hex:
      type: string
      pattern: '^[0-9a-f]{64}$'
      example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
    # ------------------------------------------------------------------
    # Envelopes
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - VERSION_CONFLICT
        - RATE_LIMITED
        - FEATURE_UNAVAILABLE
        - PROVIDER_UNAVAILABLE
        - PAYMENT_NOT_FINALIZED
        - PAYMENT_MISMATCH
        - PROOF_PENDING
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId, retryable, fieldErrors]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, maxLength: 500 }
            requestId: { $ref: '#/components/schemas/Uuid' }
            retryable: { type: boolean }
            fieldErrors:
              type: array
              items: { $ref: '#/components/schemas/FieldError' }
    DataMode:
      type: string
      enum: [live, demo]
      description: |-
        "live" = production read. "demo" = clearly-labelled synthetic
        fixtures/dev data. Production NEVER serves demo fixtures.
    Freshness:
      type: string
      enum: [fresh, stale, unknown]
    ResponseMeta:
      type: object
      required: [requestId, asOf, dataMode, freshness, nextCursor]
      properties:
        requestId: { $ref: '#/components/schemas/Uuid' }
        asOf: { $ref: '#/components/schemas/IsoDateTime' }
        dataMode: { $ref: '#/components/schemas/DataMode' }
        freshness: { $ref: '#/components/schemas/Freshness' }
        nextCursor:
          type: ['string', 'null']
          description: Opaque cursor for the next page; null when exhausted.
        sort:
          type: string
          description: Active sort key for this page (list endpoints).
        appliedFilters:
          type: object
          additionalProperties: true
          description: Filter context echoed back for list endpoints.
    # ------------------------------------------------------------------
    # Dossier domain (brief §13 shape)
    LifecycleStatus:
      type: string
      description: |-
        Reviewed lifecycle status of the subject. Known values include
        "active" and "uncertain"; the reviewed set is editorial, not closed.
      example: uncertain
    EvidenceBand:
      type: string
      description: Editorial evidence-coverage band, e.g. "limited".
      example: limited
    EvidenceAssessment:
      type: object
      required: [band, reason]
      properties:
        band: { $ref: '#/components/schemas/EvidenceBand' }
        reason: { type: string }
    HeroAsset:
      type: ['object', 'null']
      properties:
        url: { type: string, format: uri }
        alt: { type: string }
        contentType: { type: string }
        width: { type: integer }
        height: { type: integer }
    ContentBlock:
      type: object
      required: [type]
      discriminator:
        propertyName: type
      oneOf:
        - $ref: '#/components/schemas/ParagraphBlock'
        - $ref: '#/components/schemas/HeadingBlock'
        - $ref: '#/components/schemas/ListBlock'
        - $ref: '#/components/schemas/QuoteBlock'
        - $ref: '#/components/schemas/ImageBlock'
        - $ref: '#/components/schemas/EvidenceReferenceBlock'
      description: |-
        Sanitized structured blocks only — never arbitrary model-generated
        HTML. Factual blocks carry claimIds; claims resolve to public
        evidence records.
    ParagraphBlock:
      type: object
      required: [type, text]
      properties:
        type: { type: string, enum: [paragraph] }
        text: { type: string }
        claimIds:
          type: array
          items: { type: string }
    HeadingBlock:
      type: object
      required: [type, text, level]
      properties:
        type: { type: string, enum: [heading] }
        text: { type: string }
        level: { type: integer, minimum: 2, maximum: 4 }
    ListBlock:
      type: object
      required: [type, items]
      properties:
        type: { type: string, enum: [list] }
        ordered: { type: boolean, default: false }
        items:
          type: array
          items:
            type: object
            required: [text]
            properties:
              text: { type: string }
              claimIds:
                type: array
                items: { type: string }
    QuoteBlock:
      type: object
      required: [type, text]
      properties:
        type: { type: string, enum: [quote] }
        text: { type: string }
        attribution: { type: string }
        claimIds:
          type: array
          items: { type: string }
    ImageBlock:
      type: object
      required: [type, url]
      properties:
        type: { type: string, enum: [image] }
        url: { type: string, format: uri }
        alt: { type: string }
        caption: { type: string }
    EvidenceReferenceBlock:
      type: object
      required: [type, claimId]
      properties:
        type: { type: string, enum: [evidence-reference] }
        claimId: { type: string }
        note: { type: string }
    DossierSection:
      type: object
      required: [id, heading, blocks]
      properties:
        id: { type: string }
        heading: { type: string }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/ContentBlock' }
    Claim:
      type: object
      required: [id, statement, evidenceRecordIds]
      properties:
        id: { type: string }
        statement: { type: string }
        evidenceRecordIds:
          type: array
          items: { type: string }
    EvidenceRecord:
      type: object
      required: [id, kind, title]
      properties:
        id: { type: string }
        kind: { type: string, example: article }
        title: { type: string }
        url: { type: string, format: uri }
        excerpt: { type: string, description: Approved public excerpt only. }
        publisher: { type: string }
        publishedAt: { $ref: '#/components/schemas/IsoDateTime' }
        capturedAt: { $ref: '#/components/schemas/IsoDateTime' }
    ProofSummary:
      type: object
      required: [status, receiptId]
      properties:
        status:
          type: string
          enum: [pending, finalized, failed, unavailable]
          description: |-
            "pending" while the receipt anchors; publication itself is
            authoritative in the DB and unaffected by receipt state.
        receiptId: { $ref: '#/components/schemas/Uuid' }
        signature:
          type: ['string', 'null']
          description: Chain transaction signature once finalized.
    DossierSummary:
      type: object
      required: [id, slug, name, category, version, summary, lifecycleStatus,
        publishedAt, lastReviewedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        slug: { type: string, maxLength: 200 }
        name: { type: string }
        category: { type: string, example: website }
        version: { type: integer, minimum: 1 }
        summary: { type: string }
        lifecycleStatus: { $ref: '#/components/schemas/LifecycleStatus' }
        publishedAt: { $ref: '#/components/schemas/IsoDateTime' }
        lastReviewedAt: { $ref: '#/components/schemas/IsoDateTime' }
        heroAsset: { $ref: '#/components/schemas/HeroAsset' }
    DossierDetail:
      type: object
      required:
        - id
        - slug
        - name
        - category
        - version
        - summary
        - lifecycleStatus
        - statusReason
        - evidenceAssessment
        - publishedAt
        - lastReviewedAt
        - lastObservedAt
        - nextReviewAt
        - heroAsset
        - sections
        - timelinePreview
        - sourceCount
        - proof
        - availableMetrics
        - relationsPreview
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        slug: { type: string, maxLength: 200 }
        name: { type: string }
        category: { type: string, example: website }
        version: { type: integer, minimum: 1 }
        summary: { type: string }
        lifecycleStatus: { $ref: '#/components/schemas/LifecycleStatus' }
        statusReason: { type: string }
        evidenceAssessment: { $ref: '#/components/schemas/EvidenceAssessment' }
        publishedAt: { $ref: '#/components/schemas/IsoDateTime' }
        lastReviewedAt: { $ref: '#/components/schemas/IsoDateTime' }
        lastObservedAt: { $ref: '#/components/schemas/IsoDateTime' }
        nextReviewAt: { $ref: '#/components/schemas/IsoDateTime' }
        heroAsset: { $ref: '#/components/schemas/HeroAsset' }
        sections:
          type: array
          items: { $ref: '#/components/schemas/DossierSection' }
        timelinePreview:
          type: array
          items: { $ref: '#/components/schemas/TimelineEvent' }
        sourceCount: { type: integer, minimum: 0 }
        proof: { $ref: '#/components/schemas/ProofSummary' }
        availableMetrics:
          type: array
          items: { type: string }
          description: Metric names with actual observations behind them.
        relationsPreview:
          type: array
          items: { $ref: '#/components/schemas/Relation' }
    DossierDetailResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/DossierDetail' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    DossierSummaryResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DossierSummary' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    # ------------------------------------------------------------------
    # Versions, timeline, sources, metrics, relations, changes
    VersionSummary:
      type: object
      required: [version, publishedAt, canonicalHash]
      properties:
        version: { type: integer, minimum: 1 }
        publishedAt: { $ref: '#/components/schemas/IsoDateTime' }
        label:
          type: ['string', 'null']
          enum: [correction, retraction, null]
        changeSummary: { type: string }
        canonicalHash: { $ref: '#/components/schemas/Sha256Hex' }
    VersionDetail:
      type: object
      required: [version, publishedAt, canonicalHash, content, receipt]
      properties:
        version: { type: integer, minimum: 1 }
        publishedAt: { $ref: '#/components/schemas/IsoDateTime' }
        label:
          type: ['string', 'null']
          enum: [correction, retraction, null]
        changeSummary: { type: string }
        canonicalHash: { $ref: '#/components/schemas/Sha256Hex' }
        previousPayloadHash: { $ref: '#/components/schemas/Sha256Hex' }
        content: { $ref: '#/components/schemas/DossierDetail' }
        receipt: { $ref: '#/components/schemas/Receipt' }
    DatePrecision:
      type: string
      enum: [day, month, year]
    TimelineEvent:
      type: object
      required: [id, date, datePrecision, title, evidenceRefs]
      properties:
        id: { type: string }
        date: { type: string, example: '2019-06-01' }
        datePrecision: { $ref: '#/components/schemas/DatePrecision' }
        title: { type: string }
        summary: { type: string }
        evidenceRefs:
          type: array
          items: { type: string }
    SourceRecord:
      type: object
      required: [id, kind, title, url]
      properties:
        id: { type: string }
        kind: { type: string, example: article }
        title: { type: string }
        url: { type: string, format: uri }
        excerpt: { type: string, description: Approved public excerpt only. }
        publisher: { type: string }
        publishedAt: { $ref: '#/components/schemas/IsoDateTime' }
        capturedAt: { $ref: '#/components/schemas/IsoDateTime' }
    MetricObservation:
      type: object
      required: [id, name, unit, value, observedAt, provenance]
      properties:
        id: { type: string }
        name: { type: string }
        unit: { type: string }
        value:
          type: string
          description: Decimal or integer as a string; never a float.
        observedAt: { $ref: '#/components/schemas/IsoDateTime' }
        provenance: { type: string }
        coverageStart: { $ref: '#/components/schemas/IsoDateTime' }
        coverageEnd: { $ref: '#/components/schemas/IsoDateTime' }
      description: |-
        Actual observations only, with units, provenance and coverage
        intervals. Missing intervals remain missing — never backfilled with
        generated curves.
    Relation:
      type: object
      required: [subjectId, slug, name, kind]
      properties:
        subjectId: { $ref: '#/components/schemas/Uuid' }
        slug: { type: string }
        name: { type: string }
        kind: { type: string, example: successor }
        claimIds:
          type: array
          items: { type: string }
    ChangeEntry:
      type: object
      required: [version, previousVersion, publishedAt, summary]
      properties:
        version: { type: integer, minimum: 1 }
        previousVersion: { type: integer, minimum: 1 }
        publishedAt: { $ref: '#/components/schemas/IsoDateTime' }
        summary: { type: string }
        editorialNote: { type: string }
    # ------------------------------------------------------------------
    # Home, collections, search, activity, stats, receipts, misc public
    FeatureFlags:
      type: object
      required: [payments, token, submissions, corrections, accounts]
      properties:
        payments: { type: boolean }
        token: { type: boolean }
        submissions: { type: boolean }
        corrections: { type: boolean }
        accounts: { type: boolean }
    ProviderStatus:
      type: object
      required: [id, kind, status, lastCheckedAt]
      properties:
        id: { type: string }
        kind: { type: string, example: search }
        status: { type: string, enum: [healthy, degraded, unavailable] }
        lastCheckedAt: { $ref: '#/components/schemas/IsoDateTime' }
    AppConfig:
      type: object
      required:
        - brand
        - canonicalUrls
        - features
        - chain
        - providers
        - acceptedPaymentAssets
      properties:
        brand:
          type: object
          required: [name, tagline]
          properties:
            name: { type: string, example: AFTERBYTE }
            tagline: { type: string }
        canonicalUrls:
          type: object
          required: [web]
          properties:
            web: { type: string, format: uri }
            api: { type: string, format: uri }
        features: { $ref: '#/components/schemas/FeatureFlags' }
        chain:
          type: object
          required: [name]
          properties:
            name: { type: string, example: solana }
            cluster: { type: string, example: mainnet-beta }
        receiptProgramId: { type: string, description: Set only when configured. }
        acceptedPaymentAssets:
          type: array
          items: { type: string }
          description: Empty until payments are enabled and assets verified.
        providers:
          type: array
          items: { $ref: '#/components/schemas/ProviderStatus' }
    HomeEdition:
      type: object
      required:
        - editionId
        - headline
        - featured
        - recentChanges
        - stillAlive
        - researchFeedPreview
        - stats
      properties:
        editionId: { $ref: '#/components/schemas/Uuid' }
        headline: { type: string }
        featured:
          type: array
          items: { $ref: '#/components/schemas/DossierSummary' }
        recentChanges:
          type: array
          items: { $ref: '#/components/schemas/ChangeEntry' }
        stillAlive:
          type: array
          items: { $ref: '#/components/schemas/DossierSummary' }
          description: Reviewed "Still Alive" selections.
        researchFeedPreview:
          type: array
          items: { $ref: '#/components/schemas/ActivityEvent' }
        stats: { $ref: '#/components/schemas/StatsSnapshot' }
    StatsSnapshot:
      type: object
      required: [asOf, freshness, counters]
      properties:
        asOf: { $ref: '#/components/schemas/IsoDateTime' }
        freshness: { $ref: '#/components/schemas/Freshness' }
        counters:
          type: array
          items:
            type: object
            required: [key, value, definition]
            properties:
              key: { type: string, example: archive_count }
              value: { type: integer, minimum: 0 }
              definition:
                type: string
                example: non-retracted published subjects
      description: |-
        Published counters with definitions. archive_count = non-retracted
        published subjects; active_count = subjects whose current reviewed
        status is active; recorded_count = versions with finalized receipts.
        Never label a source count as people or users.
    Collection:
      type: object
      required: [slug, title, description, items]
      properties:
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/DossierSummary' }
    SuggestHit:
      type: object
      required: [slug, name, matchedAlias]
      properties:
        slug: { type: string }
        name: { type: string }
        matchedAlias: { type: string }
        category: { type: string }
    ActivityEvent:
      type: object
      required:
        - eventId
        - sequenceId
        - eventType
        - occurredAt
        - aggregateRevision
        - payload
      properties:
        eventId: { $ref: '#/components/schemas/Uuid' }
        sequenceId:
          type: string
          pattern: '^[0-9]+$'
          description: PostgreSQL BIGINT sequence serialized as a string.
        eventType:
          type: string
          enum:
            - dossier.published
            - dossier.corrected
            - dossier.retracted
            - subject.status_changed
            - research.started
            - research.completed
            - receipt.finalized
            - resync_required
        occurredAt: { $ref: '#/components/schemas/IsoDateTime' }
        subjectId: { $ref: '#/components/schemas/Uuid' }
        dossierVersion: { type: integer, minimum: 1 }
        aggregateRevision: { type: integer, minimum: 0 }
        payload:
          type: object
          additionalProperties: true
          description: Small public payload; never sensitive.
      description: |-
        Delivery is at-least-once; consumers deduplicate by eventId and
        ignore older aggregateRevision values.
    Receipt:
      type: object
      required: [id, subjectId, version, status, payloadHash]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        subjectId: { $ref: '#/components/schemas/Uuid' }
        version: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [pending, finalized, failed, unavailable]
        payloadHash: { $ref: '#/components/schemas/Sha256Hex' }
        signature: { type: ['string', 'null'] }
        slot: { type: ['integer', 'null'] }
        finalizedAt: { $ref: '#/components/schemas/IsoDateTime' }
        canonicalUrl:
          type: ['string', 'null']
          format: uri
          description: Link to the canonical bundle for independent verification.
        explorerUrl:
          type: ['string', 'null']
          format: uri
          description: Independently verifiable transaction link.
    Methodology:
      type: object
      required: [version, updatedAt, sections]
      properties:
        version: { type: string }
        updatedAt: { $ref: '#/components/schemas/IsoDateTime' }
        sections:
          type: array
          items:
            type: object
            required: [heading, body]
            properties:
              heading: { type: string }
              body: { type: string }
    ServiceStatus:
      type: object
      required: [status, asOf, components]
      properties:
        status: { type: string, enum: [operational, degraded, maintenance] }
        asOf: { $ref: '#/components/schemas/IsoDateTime' }
        components:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string }
              status: { type: string, enum: [operational, degraded, down] }
              detail: { type: string }
      description: Safe operational status — no secrets.
    ShareCard:
      type: object
      required: [url, title, description, version]
      properties:
        url: { type: string, format: uri }
        imageUrl: { type: string, format: uri }
        title: { type: string }
        description: { type: string }
        version: { type: integer, minimum: 1 }
      description: Immutable share image/metadata for an approved publication.
    # ------------------------------------------------------------------
    # Identity
    AuthChallengeRequest:
      type: object
      required: [walletAddress, chain]
      properties:
        walletAddress: { type: string, minLength: 32, maxLength: 64 }
        chain: { type: string, enum: [solana] }
    AuthChallengeResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [challenge, message, expiresAt]
          properties:
            challenge: { type: string }
            message: { type: string, description: Exact message to sign. }
            expiresAt: { $ref: '#/components/schemas/IsoDateTime' }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    AuthVerifyRequest:
      type: object
      required: [walletAddress, challenge, signature]
      properties:
        walletAddress: { type: string, minLength: 32, maxLength: 64 }
        challenge: { type: string }
        signature: { type: string }
    AuthToken:
      type: object
      required: [tokenType, accessToken, expiresAt, user]
      properties:
        tokenType: { type: string, enum: [Bearer] }
        accessToken: { type: string }
        expiresAt: { $ref: '#/components/schemas/IsoDateTime' }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, walletAddress, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        walletAddress: { type: string }
        displayName: { type: ['string', 'null'], maxLength: 60 }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
    Bookmark:
      type: object
      required: [subjectId, createdAt]
      properties:
        subjectId: { $ref: '#/components/schemas/Uuid' }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
    WatchlistItem:
      type: object
      required: [subjectId, createdAt]
      properties:
        subjectId: { $ref: '#/components/schemas/Uuid' }
        note: { type: ['string', 'null'], maxLength: 280 }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
    Notification:
      type: object
      required: [id, type, title, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        type: { type: string, example: dossier.corrected }
        title: { type: string }
        body: { type: ['string', 'null'] }
        readAt: { $ref: '#/components/schemas/IsoDateTime' }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
    NotificationReadUpdate:
      type: object
      required: [read]
      properties:
        read: { type: boolean, description: Read state only; no other fields. }
    Submission:
      type: object
      required: [id, subjectName, candidateUrls, reason, status, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        subjectName: { type: string, maxLength: 200 }
        candidateUrls:
          type: array
          maxItems: 10
          items: { type: string, format: uri, maxLength: 2000 }
        reason: { type: string, maxLength: 2000 }
        status:
          type: string
          enum: [received, in_review, accepted, rejected]
        ticketNumber: { type: string }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
    SubmissionCreate:
      type: object
      required: [subjectName, candidateUrls, reason]
      properties:
        subjectName: { type: string, minLength: 2, maxLength: 200 }
        candidateUrls:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, format: uri, maxLength: 2000 }
        reason: { type: string, minLength: 10, maxLength: 2000 }
    Correction:
      type: object
      required: [id, dossierSlug, issue, evidenceUrls, text, status, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        dossierSlug: { type: string }
        issue: { type: string, maxLength: 500 }
        evidenceUrls:
          type: array
          maxItems: 10
          items: { type: string, format: uri, maxLength: 2000 }
        text: { type: string, maxLength: 5000 }
        status:
          type: string
          enum: [received, in_review, accepted, rejected]
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
    CorrectionCreate:
      type: object
      required: [issue, evidenceUrls, text]
      properties:
        issue: { type: string, minLength: 10, maxLength: 500 }
        evidenceUrls:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, format: uri, maxLength: 2000 }
        text: { type: string, minLength: 10, maxLength: 5000 }
    # ------------------------------------------------------------------
    # Admin: research, drafts, moderation
    ResearchRun:
      type: object
      required: [id, kind, status, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, example: discovery }
        subjectId: { $ref: '#/components/schemas/Uuid' }
        status:
          type: string
          enum:
            [queued, awaiting_provider, running, succeeded, failed, cancelled]
        startedAt: { $ref: '#/components/schemas/IsoDateTime' }
        finishedAt: { $ref: '#/components/schemas/IsoDateTime' }
        costUsd:
          type: ['string', 'null']
          description: Decimal as a string; never a float.
        error: { type: ['string', 'null'] }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
    ResearchRunCreate:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [discovery, refresh, recheck]
        subjectId: { $ref: '#/components/schemas/Uuid' }
        subjectName: { type: string, maxLength: 200 }
    Draft:
      type: object
      required: [id, subjectId, revision, status, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        subjectId: { $ref: '#/components/schemas/Uuid' }
        revision: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [draft, in_review, approved, published, rejected]
        content:
          type: object
          additionalProperties: true
          description: Draft working content; only published versions are immutable.
        reviewNotes: { type: ['string', 'null'] }
        updatedAt: { $ref: '#/components/schemas/IsoDateTime' }
        updatedBy: { $ref: '#/components/schemas/Uuid' }
    DraftPatch:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision:
          type: integer
          minimum: 1
          description: |-
            Optimistic concurrency: must equal the current revision or the
            update fails with 409 VERSION_CONFLICT.
        content:
          type: object
          additionalProperties: true
        reviewNotes: { type: ['string', 'null'] }
    PublishRequest:
      type: object
      required: [expectedRevision, intendedPublishedAt]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        intendedPublishedAt:
          $ref: '#/components/schemas/IsoDateTime'
          description: Fixed before hashing; recorded in the canonical payload.
    ModerationDecision:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject, request_changes]
        note: { type: string, maxLength: 2000 }
    RetractRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 2000 }
        expectedRevision: { type: integer, minimum: 1 }
      description: |-
        Operational removal unlists the page and publishes a notice; already-
        public chain hashes cannot be erased and this is disclosed to the admin.
    HomeEditionAdmin:
      type: object
      required: [id, status, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        status:
          type: string
          enum: [scheduled, live, archived]
        publishAt: { $ref: '#/components/schemas/IsoDateTime' }
        headline: { type: string }
        featuredSubjectIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
        updatedAt: { $ref: '#/components/schemas/IsoDateTime' }
    HomeEditionPatch:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        status: { type: string, enum: [scheduled, live, archived] }
        publishAt: { $ref: '#/components/schemas/IsoDateTime' }
        headline: { type: string, maxLength: 200 }
        featuredSubjectIds:
          type: array
          maxItems: 12
          items: { $ref: '#/components/schemas/Uuid' }
    QueueHealth:
      type: object
      required: [name, waiting, active, delayed, failed]
      properties:
        name: { type: string }
        waiting: { type: integer, minimum: 0 }
        active: { type: integer, minimum: 0 }
        delayed: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        paused: { type: boolean }
    CostReport:
      type: object
      required: [periodStart, periodEnd, totalUsd, byProvider, circuitBreaker]
      properties:
        periodStart: { $ref: '#/components/schemas/IsoDateTime' }
        periodEnd: { $ref: '#/components/schemas/IsoDateTime' }
        totalUsd: { type: string, description: Decimal as a string. }
        budgetUsd: { type: ['string', 'null'] }
        byProvider:
          type: array
          items:
            type: object
            required: [providerId, costUsd]
            properties:
              providerId: { type: string }
              costUsd: { type: string }
        circuitBreaker:
          type: object
          required: [state]
          properties:
            state: { type: string, enum: [closed, open, half_open] }
            openedAt: { $ref: '#/components/schemas/IsoDateTime' }
            reason: { type: string }
    AuditLogEntry:
      type: object
      required: [id, actorId, action, targetType, targetId, at]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        actorId: { $ref: '#/components/schemas/Uuid' }
        action: { type: string, example: draft.approve }
        targetType: { type: string, example: draft }
        targetId: { type: string }
        at: { $ref: '#/components/schemas/IsoDateTime' }
        metadata:
          type: object
          additionalProperties: true
    Asset:
      type: object
      required: [id, kind, status, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { type: string, enum: [image, document] }
        status:
          type: string
          enum: [pending_upload, quarantined, approved, rejected]
        url: { type: ['string', 'null'], format: uri }
        sizeBytes: { type: ['integer', 'null'], minimum: 0 }
        contentType: { type: ['string', 'null'] }
        alt: { type: ['string', 'null'] }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
    UploadIntentRequest:
      type: object
      required: [kind, contentType, sizeBytes]
      properties:
        kind: { type: string, enum: [image, document] }
        contentType: { type: string, maxLength: 127 }
        sizeBytes: { type: integer, minimum: 1, maximum: 52428800 }
        alt: { type: string, maxLength: 300 }
    UploadIntent:
      type: object
      required: [assetId, uploadUrl, expiresAt]
      properties:
        assetId: { $ref: '#/components/schemas/Uuid' }
        uploadUrl: { type: string, format: uri }
        expiresAt: { $ref: '#/components/schemas/IsoDateTime' }
        requiredHeaders:
          type: object
          additionalProperties: { type: string }
    # ------------------------------------------------------------------
    # Payments (Release B, feature-flagged OFF in v1)
    OrderStatus:
      type: string
      enum:
        - submitted
        - accepted
        - quoted
        - quote_accepted
        - funded
        - fulfilled
        - cancelled
        - refund_requested
        - refunded
    Quote:
      type: object
      required:
        - deliverable
        - asset
        - amount
        - expiry
        - deliveryDeadline
        - cancellationTerms
        - termsVersion
      properties:
        deliverable: { type: string }
        asset: { type: string, example: SOL }
        amount:
          type: string
          pattern: '^[0-9]+$'
          description: Exact integer amount in base units (lamports / base units).
        expiry: { $ref: '#/components/schemas/IsoDateTime' }
        deliveryDeadline: { $ref: '#/components/schemas/IsoDateTime' }
        cancellationTerms: { type: string }
        refundTerms: { type: string }
        termsVersion: { type: string }
    InvestigationOrder:
      type: object
      required: [id, subjectName, status, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        subjectName: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        quote: { $ref: '#/components/schemas/Quote' }
        paymentIntentId: { $ref: '#/components/schemas/Uuid' }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
    InvestigationOrderCreate:
      type: object
      required: [subjectName, scope]
      properties:
        subjectName: { type: string, minLength: 2, maxLength: 200 }
        scope: { type: string, minLength: 20, maxLength: 5000 }
        candidateUrls:
          type: array
          maxItems: 10
          items: { type: string, format: uri, maxLength: 2000 }
    PaymentIntentStatus:
      type: string
      enum: [created, submitted, finalized, mismatched, expired, cancelled]
    PaymentIntent:
      type: object
      required:
        - id
        - orderId
        - payerAddress
        - chain
        - asset
        - recipient
        - amount
        - reference
        - status
        - expiresAt
        - createdAt
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        orderId: { $ref: '#/components/schemas/Uuid' }
        payerAddress: { type: string }
        chain: { type: string, enum: [solana] }
        asset: { type: string, example: SOL }
        mint: { type: ['string', 'null'], description: Allowlisted mint for SPL assets. }
        recipient: { type: string }
        amount:
          type: string
          pattern: '^[0-9]+$'
          description: Exact integer amount in base units.
        reference: { type: string }
        status: { $ref: '#/components/schemas/PaymentIntentStatus' }
        txSignature: { type: ['string', 'null'] }
        instructions:
          type: ['string', 'null']
          description: Human-readable transaction instructions for the wallet.
        expiresAt: { $ref: '#/components/schemas/IsoDateTime' }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
    SubmitSignatureRequest:
      type: object
      required: [txSignature]
      properties:
        txSignature: { type: string, minLength: 64, maxLength: 128 }
      description: |-
        The server verifies the transaction against a trusted configured RPC
        (finalized success, signers, reference, recipient, asset, amount,
        instruction path). A claimed signature alone is not settlement.
    Refund:
      type: object
      required: [id, orderId, amount, status, reason, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        orderId: { $ref: '#/components/schemas/Uuid' }
        amount: { type: string, pattern: '^[0-9]+$' }
        status:
          type: string
          enum: [requested, approved, rejected, executed]
        reason: { type: string }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
    RefundRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 2000 }
    Award:
      type: object
      required: [id, recipient, amount, asset, status, reason, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        recipient: { type: string }
        amount: { type: string, pattern: '^[0-9]+$' }
        asset: { type: string }
        status:
          type: string
          enum: [proposed, approved, executed, rejected]
        reason: { type: string }
        createdAt: { $ref: '#/components/schemas/IsoDateTime' }
    AwardCreate:
      type: object
      required: [recipient, amount, asset, reason]
      properties:
        recipient: { type: string, minLength: 32, maxLength: 64 }
        amount: { type: string, pattern: '^[0-9]+$' }
        asset: { type: string }
        reason: { type: string, minLength: 10, maxLength: 2000 }
