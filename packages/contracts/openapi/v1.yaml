# AFTERBYTE public API contract — v1 (FROZEN, Milestone 1)
# This file is the ASSEMBLY SOURCE for openapi/v1.yaml. The build step
# concatenates head.yaml + path chunk files into v1.yaml; v1.yaml is the
# checked-in source of truth consumed by CI, the TS generator and the frontend.
openapi: 3.1.0
info:
  title: AFTERBYTE API
  version: 1.0.0
  summary: Editorial research archive — versioned REST + public SSE.
  description: |-
    AFTERBYTE backend v1 contract. Prefix `/api/v1`.

    Conventions (brief §12):
    - Every success response uses the envelope
      `{ "data": ..., "meta": { "requestId", "asOf", "dataMode", "freshness",
      "nextCursor" } }`, except `GET .../canonical` which returns the exact
      canonical bytes (hash verification must not depend on the envelope) and
      `GET /events/stream` which is `text/event-stream`.
    - Every error uses `{ "error": { "code", "message", "requestId",
      "retryable", "fieldErrors" } }`.
    - Cursor pagination: default page size 24, maximum 100, deterministic
      ordering with an ID tiebreaker; `meta.nextCursor` carries the sort/filter
      context of the request that produced it.
    - `dataMode` is `"live"` for production reads. Fixtures and synthetic dev
      data are labelled `"demo"` and production NEVER serves them.
    - ETag/If-None-Match on public reads; If-Match (or `expectedRevision` body
      field) on editorial updates; Idempotency-Key required on payment creation
      and other costly mutations (scoped to user+route; reuse with a different
      body is rejected).
    - No token issuance, ticker or economics content anywhere in v1. Payments
      are documented as feature-flagged OFF (`PAYMENTS_ENABLED=false`) until
      treasury config, asset verification, fee policy, refund terms,
      reconciliation and settlement tests are all confirmed.
    - Placeholders: `{API_ORIGIN}` is used wherever a deployment URL would go.
      No real deployment URLs are claimed in this contract.
servers:
  - url: '{API_ORIGIN}/api/v1'
    description: Configured deployment origin (placeholder, not a real URL).
tags:
  - name: public
    description: Unauthenticated read endpoints.
  - name: identity
    description: Wallet-authenticated personal endpoints.
  - name: admin
    description: Admin endpoints. Every route performs a permission check.
  - name: payments
    description: |-
      Release B interfaces behind the `payments` feature flag. While
      `PAYMENTS_ENABLED=false` every endpoint here returns 503
      `FEATURE_UNAVAILABLE`. No payment CTA may be shown by the frontend.
  - name: system
    description: Container health probes. No envelope; never require auth.
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      operationId: healthLive
      tags:
        - system
      summary: Liveness probe
      description: Kubernetes/container liveness probe. No envelope; never requires auth.
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string
  /health/ready:
    get:
      operationId: healthReady
      tags:
        - system
      summary: Readiness probe
      description: Readiness reflects only the dependencies needed by the process. Optional capabilities report degraded, never not_ready.
      responses:
        '200':
          description: Ready (or degraded)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ready
                      - degraded
                  checks:
                    type: array
                    items:
                      type: object

  /config:
    get:
      operationId: getConfig
      tags:
        - public
      summary: Retrieve global API configuration
      description: Returns the current API configuration, including feature flags and service metadata. Supports conditional requests via ETag.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Configuration retrieved successfully
          headers:
            ETag:
              schema:
                type: string
              description: Entity tag for caching
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/AppConfig'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '304':
          description: Configuration unchanged since If-None-Match value
  /home:
    get:
      operationId: getHome
      tags:
        - public
      summary: Retrieve home edition content
      description: Returns curated home edition content. Supports conditional requests via ETag.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Home edition retrieved successfully
          headers:
            ETag:
              schema:
                type: string
              description: Entity tag for caching
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/HomeEdition'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '304':
          description: Home edition unchanged since If-None-Match value
  /dossiers:
    get:
      operationId: listDossiers
      tags:
        - public
      summary: Search and list dossiers
      description: Returns a paginated list of dossier summaries. Supports full-text search via the q parameter. When q is provided and the search provider is unavailable, a 503 ProviderUnavailable error is returned. Note that no metric is referred to as "momentum" in this API.
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
          description: Full-text search query
        - name: category
          in: query
          schema:
            type: string
          description: Filter by category
        - name: lifecycleStatus
          in: query
          schema:
            type: string
          description: Filter by lifecycle status
        - name: era
          in: query
          schema:
            type: string
          description: Filter by era
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - relevance
              - recently_updated
              - recently_verified
            default: relevance
          description: Sort order for results
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Dossiers retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DossierSummary'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
  /dossiers/{slug}:
    get:
      operationId: getDossier
      tags:
        - public
      summary: Retrieve a dossier by slug
      description: Returns the full detail of a single dossier. Supports conditional requests via ETag.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 200
          description: Dossier slug identifier
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Dossier retrieved successfully
          headers:
            ETag:
              schema:
                type: string
              description: Entity tag for caching
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/DossierDetail'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '304':
          description: Dossier unchanged since If-None-Match value
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /dossiers/{slug}/versions:
    get:
      operationId: listDossierVersions
      tags:
        - public
      summary: List all versions of a dossier
      description: Retrieve public version summaries for a dossier, ordered newest first. Each summary includes correction and retraction labels where applicable.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: Dossier slug identifier
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Version summaries retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VersionSummary'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /dossiers/{slug}/versions/{version}:
    get:
      operationId: getDossierVersion
      tags:
        - public
      summary: Retrieve a specific dossier version
      description: Fetch immutable content and current receipt metadata for a specific version. Supports conditional requests via ETag.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: Dossier slug identifier
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: Version number (1-indexed)
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Version detail retrieved successfully
          headers:
            ETag:
              schema:
                type: string
              description: Entity tag for caching
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/VersionDetail'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '304':
          description: Not modified
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /dossiers/{slug}/versions/{version}/canonical:
    get:
      operationId: getDossierVersionCanonical
      tags:
        - public
      summary: Retrieve canonical bytes for a version
      description: Returns the exact immutable canonical bytes for a specific version as application/octet-stream. Hash verification must be performed against these raw bytes independent of any JSON response envelope. Suitable for long-term caching with Cache-Control headers.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: Dossier slug identifier
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: Version number (1-indexed)
      responses:
        '200':
          description: Canonical bytes returned successfully
          headers:
            ETag:
              schema:
                type: string
              description: Entity tag for caching
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
  /dossiers/{slug}/timeline:
    get:
      operationId: getDossierTimeline
      tags:
        - public
      summary: Retrieve published timeline events for a dossier
      description: Returns chronologically ordered published events with date precision and evidence references.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 200
          description: Dossier slug identifier
      responses:
        '200':
          description: Timeline events retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TimelineEvent'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '404':
          $ref: '#/components/responses/NotFound'
  /dossiers/{slug}/sources:
    get:
      operationId: getDossierSources
      tags:
        - public
      summary: Retrieve public sources for a dossier
      description: Returns public metadata and approved excerpts only. Private snapshots are never exposed.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 200
          description: Dossier slug identifier
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Sources retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SourceRecord'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /dossiers/{slug}/metrics:
    get:
      operationId: getDossierMetrics
      tags:
        - public
      summary: Retrieve metric observations for a dossier
      description: Returns actual observations with units, provenance and coverage intervals. Missing intervals are never backfilled.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 200
          description: Dossier slug identifier
      responses:
        '200':
          description: Metrics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MetricObservation'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '404':
          $ref: '#/components/responses/NotFound'
  /dossiers/{slug}/relations:
    get:
      operationId: getDossierRelations
      tags:
        - public
      summary: Retrieve published relationship graph for a dossier
      description: Returns bounded published relationships. Optionally filter to relations supporting a specific claim.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 200
          description: Dossier slug identifier
        - name: claimId
          in: query
          required: false
          schema:
            type: string
          description: Filter relations to those supporting this claim identifier
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Relations retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Relation'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /dossiers/{slug}/changes:
    get:
      operationId: getDossierChanges
      tags:
        - public
      summary: Retrieve editorial changes across published versions
      description: Returns editorial diffs and explanations across published versions, newest first.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            maxLength: 200
          description: Dossier slug identifier
      responses:
        '200':
          description: Changes retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChangeEntry'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '404':
          $ref: '#/components/responses/NotFound'
  /collections/{slug}:
    get:
      operationId: getCollection
      tags:
        - public
      summary: Retrieve a collection by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: Collection slug identifier
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Collection retrieved successfully
          headers:
            ETag:
              schema:
                type: string
              description: Entity tag for cache validation
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/Collection'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '304':
          description: Not modified
        '404':
          $ref: '#/components/responses/NotFound'
  /search/suggest:
    get:
      operationId: suggestSearch
      tags:
        - public
      summary: Suggest search results by title or alias
      description: Returns title and alias matches only. Results are cached and short-lived.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
          description: Search query string
      responses:
        '200':
          description: Suggestions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SuggestHit'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
  /activity:
    get:
      operationId: listActivity
      tags:
        - public
      summary: List public activity events
      description: Returns public events in sequence order. The after parameter accepts string sequence IDs to paginate forward.
      parameters:
        - name: after
          in: query
          schema:
            type: string
            pattern: '^[0-9]+$'
          description: Return events after this sequence ID (string)
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Activity events retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivityEvent'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /stats:
    get:
      operationId: getStats
      tags:
        - public
      summary: Retrieve current statistics snapshot
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Statistics snapshot retrieved successfully
          headers:
            ETag:
              schema:
                type: string
              description: Entity tag for cache validation
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/StatsSnapshot'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '304':
          description: Not modified
  /receipts/{id}:
    get:
      operationId: getReceipt
      tags:
        - public
      summary: Retrieve a receipt by ID
      description: Returns chain metadata, finality status, hash, and canonical bundle link. Pending status is returned as data, not an error.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Receipt UUID
      responses:
        '200':
          description: Receipt retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/Receipt'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '404':
          $ref: '#/components/responses/NotFound'
  /methodology:
    get:
      operationId: getMethodology
      tags:
        - public
      summary: Retrieve methodology documentation
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Methodology retrieved successfully
          headers:
            ETag:
              schema:
                type: string
              description: Entity tag for cache validation
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/Methodology'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '304':
          description: Not modified
  /status:
    get:
      operationId: getServiceStatus
      tags:
        - public
      summary: Retrieve service operational status
      responses:
        '200':
          description: Service status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/ServiceStatus'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
  /share/dossiers/{slug}/{version}:
    get:
      operationId: getShareCard
      tags:
        - public
      summary: Retrieve share card for an approved publication
      description: Returns immutable share image and metadata for an approved dossier version.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: Dossier slug
        - name: version
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: Publication version number
      responses:
        '200':
          description: Share card retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/ShareCard'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /events/stream:
      get:
        operationId: streamEvents
        tags:
          - public
        summary: Stream public events via Server-Sent Events
        description: |
          Opens a persistent Server-Sent Events stream of public domain events.

          **SSE Contract:**
          - Heartbeat comment lines (`:`) are sent every 20 seconds to keep the connection alive.
          - Each event is a JSON object with fields: eventId, sequenceId, eventType, occurredAt, subjectId, dossierVersion, aggregateRevision, and payload.
          - Reconnect using the Last-Event-ID header to resume from a known point; the server replays retained events.
          - Events are retained for 7 days. If the Last-Event-ID cursor is older than retention, the server emits a resync_required event; the client must then reload canonical state via the dossier endpoints.
          - Delivery is at-least-once; consumers must deduplicate by eventId and ignore events with older aggregateRevision values.
          - All events are sanitized public events only; no instructions to manipulate DOM or execute untrusted content are included.

          **Event Types:**
          - `dossier.published`: A dossier was published.
          - `dossier.corrected`: A dossier was corrected.
          - `dossier.retracted`: A dossier was retracted.
          - `subject.status_changed`: A subject's status changed.
          - `research.started`: A research run started.
          - `research.completed`: A research run completed.
          - `receipt.finalized`: A publication receipt was finalized on chain.
          - `resync_required`: Retention window exceeded; client must reload canonical state.
        parameters:
          - $ref: '#/components/parameters/LastEventId'
          - name: after
            in: query
            schema:
              type: string
              pattern: '^[0-9]+$'
            description: Optional sequence ID to resume after; overrides Last-Event-ID if both provided.
        responses:
          '200':
            description: Server-Sent Events stream opened successfully.
            content:
              text/event-stream:
                schema:
                  type: object
                  required:
                    - eventId
                    - sequenceId
                    - eventType
                    - occurredAt
                    - aggregateRevision
                  properties:
                    eventId:
                      type: string
                      description: Unique identifier for this event; used for deduplication.
                    sequenceId:
                      type: string
                      pattern: '^[0-9]+$'
                      description: Monotonic sequence number for ordering and resumption.
                    eventType:
                      type: string
                      enum:
                        - dossier.published
                        - dossier.corrected
                        - dossier.retracted
                        - subject.status_changed
                        - research.started
                        - research.completed
                        - receipt.finalized
                        - resync_required
                      description: Type of event that occurred.
                    occurredAt:
                      type: string
                      format: date-time
                      description: RFC3339 UTC timestamp when the event occurred.
                    subjectId:
                      type: string
                      description: Identifier of the subject involved; omitted for resync_required.
                    dossierVersion:
                      type: integer
                      description: Version of the dossier affected; omitted if not applicable.
                    aggregateRevision:
                      type: integer
                      description: Aggregate revision number; used to detect stale replays.
                    payload:
                      type: object
                      description: Event-specific payload; structure varies by eventType.
  /auth/challenge:
    post:
      operationId: postAuthChallenge
      tags:
        - identity
      summary: Start a wallet sign-in challenge
      description: Initiates a Solana wallet sign-in challenge. Returns a message to be signed by the client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthChallengeRequest'
      responses:
        '200':
          description: Challenge created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - challenge
                      - message
                      - expiresAt
                    properties:
                      challenge:
                        type: string
                      message:
                        type: string
                        description: The exact message to be signed by the wallet
                      expiresAt:
                        $ref: '#/components/schemas/IsoDateTime'
                  meta:
                    $ref: '#/components/schemas/ResponseMeta'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/verify:
    post:
      operationId: postAuthVerify
      tags:
        - identity
      summary: Verify a signed challenge
      description: Verifies the signed challenge and issues an authentication token.
      requestBody:
        required: true
        content:
