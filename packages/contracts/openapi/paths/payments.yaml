/payment-intents/{id}/submit-signature:
  post:
    operationId: submitPaymentSignature
    tags:
      - payments
    summary: Submit a payment signature
    description: |
      Payments are Release B behind the payments feature flag.
      While PAYMENTS_ENABLED=false, this endpoint returns 503 FEATURE_UNAVAILABLE.
      The server verifies the transaction against a trusted configured RPC (finalized success, signers, reference, recipient, asset, amount, instruction path).
      A claimed signature alone is not settlement; credit happens once under a DB uniqueness constraint.
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Payment intent ID
      - $ref: '#/components/parameters/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SubmitSignatureRequest'
    responses:
      '202':
        description: Signature submitted and verified
        content:
          application/json:
            schema:
              type: object
              required:
                - data
                - meta
              properties:
                data:
                  $ref: '#/components/schemas/PaymentIntent'
                meta:
                  $ref: '#/components/schemas/ResponseMeta'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '404':
        $ref: '#/components/responses/NotFound'
      '409':
        $ref: '#/components/responses/PaymentNotFinalized'
      '422':
        $ref: '#/components/responses/PaymentMismatch'
      '503':
        $ref: '#/components/responses/FeatureUnavailable'
