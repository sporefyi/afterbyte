/investigation-orders:
  post:
    operationId: createInvestigationOrder
    tags:
      - payments
    summary: Create an investigation order
    description: |
      Payments are Release B behind the payments feature flag.
      While PAYMENTS_ENABLED=false, this endpoint returns 503 FEATURE_UNAVAILABLE.
      Submitting a request is free; a quote comes later.
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvestigationOrderCreate'
    responses:
      '201':
        description: Investigation order created
        content:
          application/json:
            schema:
              type: object
              required:
                - data
                - meta
              properties:
                data:
                  $ref: '#/components/schemas/InvestigationOrder'
                meta:
                  $ref: '#/components/schemas/ResponseMeta'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '422':
        $ref: '#/components/responses/ValidationFailed'
      '429':
        $ref: '#/components/responses/RateLimited'
      '503':
        $ref: '#/components/responses/FeatureUnavailable'
