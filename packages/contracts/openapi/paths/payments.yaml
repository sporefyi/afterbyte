/payment-intents:
  post:
    operationId: createPaymentIntent
    tags:
      - payments
    summary: Create a payment intent
    description: |
      Payments are Release B behind the payments feature flag.
      While PAYMENTS_ENABLED=false, this endpoint returns 503 FEATURE_UNAVAILABLE.
      Creates a single-use intent with exact integer amount, recipient and random reference.
      One intent per quoted amount and bound payer.
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - orderId
              - payerAddress
              - asset
            properties:
              orderId:
                type: string
                format: uuid
                description: Investigation order ID
              payerAddress:
                type: string
                description: Payer blockchain address
              asset:
                type: string
                description: Asset symbol (e.g. SOL)
    responses:
      '201':
        description: Payment intent created
        content:
          application/json:
            schema:
              type: object
              required:
                - data
                - meta
              properties:
                data:
                  $ref: '#/components/schemas/PaymentIntent'
                meta:
                  $ref: '#/components/schemas/ResponseMeta'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '404':
        $ref: '#/components/responses/NotFound'
      '409':
        $ref: '#/components/responses/VersionConflict'
      '422':
        $ref: '#/components/responses/ValidationFailed'
      '503':
        $ref: '#/components/responses/FeatureUnavailable'
