/admin/dossiers/{id}/retract:
  post:
    operationId: retractDossier
    tags:
      - admin
    summary: Retract a dossier
    description: Operational removal unlists the page and publishes a notice; already-public chain hashes cannot be erased. Requires admin:dossier:retract permission.
    security:
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Dossier ID
      - $ref: '#/components/parameters/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RetractRequest'
    responses:
      '200':
        description: Dossier retracted successfully
        content:
          application/json:
            schema:
              type: object
              required:
                - data
                - meta
              properties:
                data:
                  type: object
                  required:
                    - id
                    - slug
                    - status
                  properties:
                    id:
                      type: string
                      format: uuid
                    slug:
                      type: string
                    status:
                      type: string
                      enum:
                        - retracted
                meta:
                  $ref: '#/components/schemas/ResponseMeta'
      '401':
        $ref: '#/components/responses/Unauthorized'
      '403':
        $ref: '#/components/responses/Forbidden'
      '404':
        $ref: '#/components/responses/NotFound'
      '409':
        $ref: '#/components/responses/VersionConflict'
      '422':
        $ref: '#/components/responses/ValidationFailed'
/admin/dossiers/{id}/schedule-recheck:
  post:
    operationId: scheduleRecheck
    tags:
      - admin
    summary: Schedule a recheck for a dossier
    description: Enqueue a research run for the dossier. Requires admin:dossier:recheck permission.
    security:
