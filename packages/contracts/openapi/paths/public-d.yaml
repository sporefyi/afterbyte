/share/dossiers/{slug}/{version}:
  get:
    operationId: getShareCard
    tags:
      - public
    summary: Retrieve share card for an approved publication
    description: Returns immutable share image and metadata for an approved dossier version.
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Dossier slug
      - name: version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: Publication version number
    responses:
      '200':
        description: Share card retrieved successfully
        content:
          application/json:
            schema:
              type: object
              required:
                - data
                - meta
              properties:
                data:
                  $ref: '#/components/schemas/ShareCard'
                meta:
                  $ref: '#/components/schemas/ResponseMeta'
      '404':
        $ref: '#/components/responses/NotFound'
      '422':
        $ref: '#/components/responses/ValidationFailed'
