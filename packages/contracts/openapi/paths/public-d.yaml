/receipts/{id}:
  get:
    operationId: getReceipt
    tags:
      - public
    summary: Retrieve a receipt by ID
    description: Returns chain metadata, finality status, hash, and canonical bundle link. Pending status is returned as data, not an error.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Receipt UUID
    responses:
      '200':
        description: Receipt retrieved successfully
        content:
          application/json:
            schema:
              type: object
              required:
                - data
                - meta
              properties:
                data:
                  $ref: '#/components/schemas/Receipt'
                meta:
                  $ref: '#/components/schemas/ResponseMeta'
      '404':
        $ref: '#/components/responses/NotFound'
