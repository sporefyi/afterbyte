/collections/{slug}:
  get:
    operationId: getCollection
    tags:
      - public
    summary: Retrieve a collection by slug
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Collection slug identifier
      - $ref: '#/components/parameters/IfNoneMatch'
    responses:
      '200':
        description: Collection retrieved successfully
        headers:
          ETag:
            schema:
              type: string
            description: Entity tag for cache validation
        content:
          application/json:
            schema:
              type: object
              required:
                - data
                - meta
              properties:
                data:
                  $ref: '#/components/schemas/Collection'
                meta:
                  $ref: '#/components/schemas/ResponseMeta'
      '304':
        description: Not modified
      '404':
        $ref: '#/components/responses/NotFound'
/search/suggest:
  get:
    operationId: suggestSearch
    tags:
      - public
    summary: Suggest search results by title or alias
    description: Returns title and alias matches only. Results are cached and short-lived.
    parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
        description: Search query string
    responses:
      '200':
        description: Suggestions retrieved successfully
        content:
          application/json:
            schema:
              type: object
              required:
                - data
                - meta
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/SuggestHit'
                meta:
                  $ref: '#/components/schemas/ResponseMeta'
      '422':
        $ref: '#/components/responses/ValidationFailed'
      '429':
        $ref: '#/components/responses/RateLimited'
      '503':
        $ref: '#/components/responses/ProviderUnavailable'
/activity:
  get:
    operationId: listActivity
    tags:
      - public
    summary: List public activity events
    description: Returns public events in sequence order. The after parameter accepts string sequence IDs to paginate forward.
    parameters:
      - name: after
        in: query
        schema:
          type: string
          pattern: '^[0-9]+$'
        description: Return events after this sequence ID (string)
      - $ref: '#/components/parameters/Limit'
    responses:
      '200':
        description: Activity events retrieved successfully
        content:
          application/json:
            schema:
              type: object
              required:
                - data
                - meta
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/ActivityEvent'
                meta:
                  $ref: '#/components/schemas/ResponseMeta'
      '422':
        $ref: '#/components/responses/ValidationFailed'
